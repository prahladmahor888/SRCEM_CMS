<!-- MODAL: Upload Deliverable -->
<div id="uploadModal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/85 backdrop-blur-sm">
    <div class="bg-white dark:bg-darkSurface w-full max-w-xl rounded-3xl shadow-2xl border border-gray-100 dark:border-gray-800 overflow-hidden animate-pop">
        <form action="{% url 'upload_project_deliverable' %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="p-6 border-b border-gray-100 dark:border-gray-800 flex justify-between items-center bg-gray-50 dark:bg-gray-900/50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-indigo-50 dark:bg-indigo-900/20 text-primary flex items-center justify-center text-sm"><i class="fa-solid fa-cloud-arrow-up"></i></div>
                    <div>
                        <h3 class="font-black text-gray-900 dark:text-white uppercase tracking-tight">Upload Project File</h3>
                        <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">Submit document or code archive for evaluation</p>
                    </div>
                </div>
                <button type="button" onclick="closeUploadModal()" class="w-10 h-10 flex items-center justify-center text-gray-400 hover:text-secondary hover:bg-red-50 dark:hover:bg-red-900/20 rounded-full transition-all"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <div class="p-6 sm:p-8 space-y-6">
                <div class="space-y-1">
                    <label class="block text-[10px] font-black text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-1.5">Deliverable Category *</label>
                    <select name="category" required class="w-full px-4 py-3 bg-gray-55 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-xs font-bold dark:text-white focus:outline-none focus:border-primary">
                        <option value="" disabled selected>Select category...</option>
                        <option value="Synopsis">Synopsis Proposal</option>
                        <option value="SRS">SRS Specification Doc</option>
                        <option value="Code">Phase Code Archive</option>
                        <option value="Other">Other Deliverable</option>
                    </select>
                </div>

                <div class="space-y-1">
                    <label class="block text-[10px] font-black text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-1.5">File Title / Description *</label>
                    <input type="text" name="title" required class="w-full px-4 py-3 bg-gray-55 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-xs font-bold dark:text-white focus:outline-none focus:border-primary" placeholder="e.g. Major Project Phase-I Architecture Design">
                </div>

                <div class="space-y-1">
                    <label class="block text-[10px] font-black text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-1.5">Attachment (PDF, ZIP, tar.gz - Max 25MB) *</label>
                    <div class="border-2 border-dashed border-gray-200 dark:border-gray-700 rounded-2xl p-8 flex flex-col items-center justify-center text-center bg-gray-55 dark:bg-gray-900/30 group hover:border-primary transition-all cursor-pointer relative overflow-hidden">
                        <div class="absolute inset-0 bg-primary opacity-0 group-hover:opacity-[0.02] transition-opacity"></div>
                        <i class="fa-solid fa-file-pdf text-4xl text-gray-300 group-hover:text-primary transition-colors mb-3"></i>
                        <h4 class="font-bold text-gray-900 dark:text-white text-xs mb-1" id="fileUploadNameDisplay">Apni file chunein</h4>
                        <p class="text-[10px] text-gray-400 font-semibold uppercase">Drag & Drop or Click to browse</p>
                        <input type="file" name="file" required class="absolute inset-0 opacity-0 cursor-pointer" onchange="updateFileLabel(this)">
                    </div>
                </div>

                <div class="flex gap-4 pt-2">
                    <button type="button" onclick="closeUploadModal()" class="flex-1 py-4 bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 text-[10px] font-black uppercase tracking-widest rounded-2xl hover:bg-gray-200 dark:hover:bg-gray-700 transition-all">Cancel</button>
                    <button type="submit" class="flex-[2] py-4 btn-gradient text-white text-[10px] font-black uppercase tracking-widest rounded-2xl transition-all">Submit Deliverable</button>
                </div>
            </div>
        </form>
    </div>
</div>
