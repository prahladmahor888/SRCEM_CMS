<!-- MODAL: Submit Weekly Log -->
<div id="logModal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/85 backdrop-blur-sm">
    <div class="bg-white dark:bg-darkSurface w-full max-w-xl rounded-3xl shadow-2xl border border-gray-100 dark:border-gray-800 overflow-hidden animate-pop">
        <form action="{% url 'submit_weekly_log' %}" method="POST">
            {% csrf_token %}
            <div class="p-6 border-b border-gray-100 dark:border-gray-800 flex justify-between items-center bg-gray-50 dark:bg-gray-900/50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-indigo-50 dark:bg-indigo-900/20 text-primary flex items-center justify-center text-sm"><i class="fa-solid fa-pen-to-square"></i></div>
                    <div>
                        <h3 class="font-black text-gray-900 dark:text-white uppercase tracking-tight">Weekly Progress Log</h3>
                        <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">Record your weekly achievements</p>
                    </div>
                </div>
                <button type="button" onclick="closeLogModal()" class="w-10 h-10 flex items-center justify-center text-gray-400 hover:text-secondary hover:bg-red-50 dark:hover:bg-red-900/20 rounded-full transition-all"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <div class="p-6 sm:p-8 space-y-6">
                <div class="space-y-1">
                    <label class="block text-[10px] font-black text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-1.5">Week Title *</label>
                    <input type="text" name="week_title" required class="w-full px-4 py-3 bg-gray-55 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-xs font-bold dark:text-white focus:outline-none focus:border-primary" placeholder="e.g. Week 9: Auth module & API Integration">
                </div>

                <div class="space-y-1">
                    <label class="block text-[10px] font-black text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-1.5">Accomplishments & Progress Details *</label>
                    <textarea name="accomplishments" rows="4" required class="w-full px-4 py-3 bg-gray-55 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-xs font-medium dark:text-white focus:outline-none focus:border-primary leading-relaxed" placeholder="Apne is hafte ke key deliverables aur implementation details yahan likhein..."></textarea>
                </div>

                <div class="space-y-1">
                    <label class="block text-[10px] font-black text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-1.5">Github Commit / Tag (Optional)</label>
                    <input type="text" name="commit_tag" class="w-full px-4 py-3 bg-gray-55 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-xs font-bold dark:text-white focus:outline-none focus:border-primary" placeholder="e.g. v1.0.3-beta or hash e89fd32">
                </div>

                <div class="flex gap-4 pt-2">
                    <button type="button" onclick="closeLogModal()" class="flex-1 py-4 bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 text-[10px] font-black uppercase tracking-widest rounded-2xl hover:bg-gray-200 dark:hover:bg-gray-700 transition-all">Cancel</button>
                    <button type="submit" class="flex-[2] py-4 btn-gradient text-white text-[10px] font-black uppercase tracking-widest rounded-2xl transition-all">Save Weekly Log</button>
                </div>
            </div>
        </form>
    </div>
</div>
