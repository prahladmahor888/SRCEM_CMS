<nav class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 h-16 sticky top-0 z-30 flex items-center justify-between px-4 sm:px-6 shadow-sm">
    <!-- Left: Sidebar Toggle & Branding -->
    <div class="flex items-center gap-4">
        <button id="mobileMenuBtn" class="md:hidden text-gray-500 hover:text-primary dark:text-gray-400 dark:hover:text-blue-400 focus:outline-none focus:ring-2 focus:ring-primary/20 p-1.5 rounded-sm transition-all">
            <i class="fa-solid fa-bars-staggered text-xl"></i>
        </button>
        
        <div class="flex items-center gap-2 group cursor-pointer">
            <div class="w-8 h-8 bg-primary dark:bg-blue-600 rounded-sm flex items-center justify-center text-white font-bold transform transition-transform group-hover:rotate-12">S</div>
            <span class="font-extrabold text-lg tracking-tight hidden sm:block text-gray-900 dark:text-white">SRCEM <span class="text-primary dark:text-blue-400">Portal</span></span>
        </div>
    </div>

    <!-- Center: Search (Desktop Only) -->
    <div class="hidden lg:flex flex-1 max-w-md mx-8">
        <div class="relative w-full">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <i class="fa-solid fa-magnifying-glass text-gray-400 text-sm"></i>
            </div>
            <input type="text" placeholder="Quick search..." class="w-full bg-gray-50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-sm py-1.5 pl-10 pr-4 text-sm focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all">
        </div>
    </div>

    <!-- Right: Actions & Profile -->
    <div class="flex items-center gap-2 sm:gap-4">
        
        <!-- Theme Toggle -->
        <button id="themeToggleBtn" class="p-2 text-gray-500 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-700/50 rounded-sm transition-colors relative group" title="Toggle Theme">
            <i class="fa-solid fa-moon text-lg" id="themeIcon"></i>
        </button>

        <!-- Notifications -->
        <button class="p-2 text-gray-500 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-700/50 rounded-sm transition-colors relative" title="Notifications">
            <i class="fa-solid fa-bell text-lg"></i>
            <span class="absolute top-2 right-2 w-2 h-2 bg-secondary rounded-full border-2 border-white dark:border-gray-800"></span>
        </button>

        <!-- Divider -->
        <div class="h-6 w-px bg-gray-200 dark:bg-gray-700 mx-1 hidden sm:block"></div>

        <!-- User Profile Dropdown -->
        <div class="relative ml-2" id="userMenuContainer">
            <button id="userMenuBtn" class="flex items-center gap-2 sm:gap-3 pl-1 pr-1 sm:pr-2 py-1 rounded-sm hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors focus:outline-none">
                <div class="w-8 h-8 rounded-sm bg-primary/10 dark:bg-blue-900/30 flex items-center justify-center text-primary dark:text-blue-400 border border-primary/20 overflow-hidden">
                    {% if user.is_authenticated %}
                        <span class="font-bold text-sm">{{ user.username|slice:":1"|upper }}</span>
                    {% else %}
                        <i class="fa-solid fa-user text-sm"></i>
                    {% endif %}
                </div>
                <div class="hidden sm:block text-left">
                    <p class="text-xs font-bold text-gray-900 dark:text-white leading-tight">
                        {% if user.is_authenticated %}{{ user.get_full_name|default:user.username }}{% else %}Guest User{% endif %}
                    </p>
                    <p class="text-[10px] font-medium text-gray-500 dark:text-gray-400 uppercase tracking-tighter">
                        {% if user.is_student_user %}Student{% elif user.is_teacher_user %}Faculty{% else %}Portal User{% endif %}
                    </p>
                </div>
                <i class="fa-solid fa-chevron-down text-[10px] text-gray-400 hidden sm:block"></i>
            </button>

            <!-- Dropdown Menu (Hidden by default) -->
            <div id="userDropdown" class="absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 rounded-sm shadow-xl border border-gray-200 dark:border-gray-700 py-1 hidden z-50">
                <a href="{% url 'profile' %}" class="flex items-center gap-2 px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700/50">
                    <i class="fa-solid fa-id-card w-4 text-center"></i> My Profile
                </a>
                <a href="#" class="flex items-center gap-2 px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700/50">
                    <i class="fa-solid fa-gear w-4 text-center"></i> Settings
                </a>
                <div class="border-t border-gray-100 dark:border-gray-700 my-1"></div>
                <a href="javascript:document.getElementById('logout-form').submit();" class="flex items-center gap-2 px-4 py-2 text-sm text-secondary font-bold hover:bg-red-50 dark:hover:bg-red-900/20">
                    <i class="fa-solid fa-power-off"></i> Logout
                </a>
            </div>
        </div>
    </div>
</nav>

<script>
    // User Dropdown Toggle
    const userMenuBtn = document.getElementById('userMenuBtn');
    const userDropdown = document.getElementById('userDropdown');
    
    if(userMenuBtn && userDropdown) {
        userMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            userDropdown.classList.toggle('hidden');
        });

        document.addEventListener('click', () => {
            userDropdown.classList.add('hidden');
        });
    }
</script>
