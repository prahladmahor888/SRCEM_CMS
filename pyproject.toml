[project]
name = "srcem-cms"

version = "0.1.0"
description = "SRCEM Campus Management System on Cloudflare Workers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=5.0",
    "python-decouple",
    "whitenoise",
    "django-cf",
    "openpyxl",
    "tzdata"
]


[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "uv"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["SRCEM_CMS", "apps"]

